name: Deploy

# Hourly: check Steve's List (https://stevelist.com/list, the source of every Show) against the last page
# ingested. When it has changed: ingest it into the data branch's database, then export it to JSON, build
# the static site and publish it to GitHub Pages; when it's a new edition (its header date in a later Friday-to-
# Thursday week, not a correction to the current one), then email everyone's weekly Alerts. An unchanged List ends the run after
# the check. A manual run ingests the List whether it has changed or not, unless told to skip the ingest;
# pushes to main only rebuild the site.
on:
  schedule:
    # Off the clock's popular minutes, so GitHub's own scheduler is less likely to delay it.
    - cron: '17 * * * *'
  workflow_dispatch:
    inputs:
      skip_ingest:
        description: Skip ingestion (rebuild from the existing data)
        type: boolean
        default: false
  push:
    branches: [main]
    paths:
      - 'frontend/**'
      - 'backend/app/**'   # the export lives in the backend
      - 'docs/guide/**'    # the docs pages
      - '.github/workflows/deploy.yml'

permissions:
  contents: read

# One run at a time; a newer run waits rather than cancelling one mid-ingest or mid-publish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  check:
    # Has the List changed since the last successful ingest, and is it a new edition? (python -m app.cli check)
    if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && !inputs.skip_ingest)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      actions: write   # for the keep-alive step below
    outputs:
      changed: ${{ steps.check.outputs.changed }}
      new_edition: ${{ steps.check.outputs.new_edition }}

    steps:
      # GitHub disables a public repository's scheduled workflows after 60 days without "repository activity", which
      # it doesn't define. Enabling this workflow on every run keeps it active, the way keep-alive actions do; that
      # this resets the 60 days isn't documented either. First, so it runs even when the check fails.
      - name: Keep the hourly schedule enabled
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api --method PUT "repos/${{ github.repository }}/actions/workflows/deploy.yml/enable"

      - uses: actions/checkout@v4

      - name: Check out the database from the data branch
        uses: actions/checkout@v4
        with:
          ref: data
          path: data
          sparse-checkout: the_list.db   # the last ingestion run is all the check reads
          sparse-checkout-cone-mode: false

      - name: Set up Python 3.12
        id: setup-python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Restore Python virtual environment
        id: cache-venv
        uses: actions/cache@v4
        with:
          path: .venv
          key: venv-${{ runner.os }}-py${{ steps.setup-python.outputs.python-version }}-${{ hashFiles('backend/requirements.txt') }}

      - name: Install backend dependencies
        run: |
          if [ "${{ steps.cache-venv.outputs.cache-hit }}" != "true" ]; then
            python -m venv .venv
            .venv/bin/pip install --upgrade pip
            .venv/bin/pip install -r backend/requirements.txt
          fi
          echo "$GITHUB_WORKSPACE/.venv/bin" >> "$GITHUB_PATH"

      - id: check
        name: Check the List
        working-directory: backend
        env:
          DATABASE_URL: sqlite:///${{ github.workspace }}/data/the_list.db
          PYTHONUNBUFFERED: 1   # the log keeps the commands' lines in order
        # Migrates this copy only (the ingest migrates the data branch's), so the check can read the runs right
        # after a migration is merged. Fails, and GitHub emails the maintainer, when the List can't be fetched.
        # The output also goes to a log for the failure email; pipefail keeps each command's exit status, and the
        # check writes its outputs to $GITHUB_OUTPUT itself, not through the pipe.
        run: |
          set -o pipefail
          { alembic upgrade head && python -m app.cli check; } 2>&1 | tee "$RUNNER_TEMP/check.log"

      - name: Email the maintainer if the ingest has been failing for two weeks
        # After a failed check (Steve's page unreachable, or not the List). Sends at most one email a day, and only
        # once the last successful ingest is 14 days old (app/notifications.py). The job stays failed either way.
        if: failure()
        continue-on-error: true
        working-directory: backend
        env:
          DATABASE_URL: sqlite:///${{ github.workspace }}/data/the_list.db
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          ALERTS_FROM: ${{ vars.ALERTS_FROM || 'The List <alerts@list.sturgis.me>' }}
          MAINTAINER_EMAIL: ${{ secrets.MAINTAINER_EMAIL }}
          SITE_URL: https://list.sturgis.me
        run: python -m app.cli notify-failure --stage check --log "$RUNNER_TEMP/check.log"

  ingest:
    needs: check
    # A changed List, or a manual run (unless skip_ingest was requested).
    if: needs.check.outputs.changed == 'true' || (github.event_name == 'workflow_dispatch' && !inputs.skip_ingest)
    runs-on: ubuntu-latest
    timeout-minutes: 60   # a new edition's ingest has taken 24 minutes, and a timed-out one saves nothing
    permissions:
      contents: write   # commit the new database to the data branch
    env:
      TS_OAUTH_CLIENT_ID: ${{ secrets.TS_OAUTH_CLIENT_ID }}   # whether to join the tailnet

    services:
      ollama:
        image: ollama/ollama:latest
        ports:
          - 11434:11434
        volumes:
          - /home/runner/.ollama:/root/.ollama   # models, cached between runs

    steps:
      - uses: actions/checkout@v4

      - name: Check out the data branch
        uses: actions/checkout@v4
        with:
          ref: data
          path: data
          fetch-depth: 5   # enough to tell whether there's history to prune

      - name: Restore the Ollama model cache
        uses: actions/cache@v4
        with:
          path: /home/runner/.ollama
          key: ollama-nomic-embed-text-tev1-0.8b-v1

      - name: Pull the embedding and genre models
        run: |
          until curl -sf http://localhost:11434/api/version > /dev/null; do sleep 2; done
          curl -sf http://localhost:11434/api/pull -d '{"model": "nomic-embed-text", "stream": false}'
          # The genre model (app/ingestion/genre_filter.py): judges whether a tag outside the vocabulary is a genre.
          curl -sf http://localhost:11434/api/pull -d '{"model": "tev1:0.8b", "stream": false}'
          # The container writes as root; let the cache step read the files.
          sudo chown -R "$USER" /home/runner/.ollama

      # Venue calendars are fetched by the page fetcher on the home server (scraper/, ADR 0007): some Venues' sites
      # turn GitHub's runners or a script's request away. The runner joins the tailnet as an ephemeral tag:ci node,
      # which the tailnet's policy lets reach only the fetcher. Without it (no OAuth client set, or the join failed)
      # pages are fetched directly, as before.
      - name: Join the tailnet
        id: tailscale
        if: env.TS_OAUTH_CLIENT_ID != ''
        continue-on-error: true
        # Pinned to a commit and a Tailscale version: this step holds the OAuth secret (the pen test of 2026-11-18).
        uses: tailscale/github-action@6cae46e2d796f265265cfcf628b72a32b4d7cade   # v3
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci
          version: 1.104.6

      - name: Set up Python 3.12
        id: setup-python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Restore Python virtual environment
        id: cache-venv
        uses: actions/cache@v4
        with:
          path: .venv
          key: venv-${{ runner.os }}-py${{ steps.setup-python.outputs.python-version }}-${{ hashFiles('backend/requirements.txt') }}

      - name: Install backend dependencies
        run: |
          if [ "${{ steps.cache-venv.outputs.cache-hit }}" != "true" ]; then
            python -m venv .venv
            .venv/bin/pip install --upgrade pip
            .venv/bin/pip install -r backend/requirements.txt
          fi
          echo "$GITHUB_WORKSPACE/.venv/bin" >> "$GITHUB_PATH"

      - name: Ingest
        working-directory: backend
        env:
          DATABASE_URL: sqlite:///${{ github.workspace }}/data/the_list.db
          FAISS_INDEX_PATH: ${{ github.workspace }}/data/faiss
          IMAGES_PATH: ${{ github.workspace }}/data/images
          OLLAMA_BASE_URL: http://localhost:11434
          GOOGLE_MAPS_API_KEY: ${{ secrets.GOOGLE_MAPS_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}   # venue calendars (app/ingestion/venue_calendar.py)
          # The home server's page fetcher (app/ingestion/page_fetch.py), when the runner is on the tailnet.
          SCRAPER_URL: ${{ steps.tailscale.outcome == 'success' && vars.SCRAPER_URL || '' }}
          SCRAPER_TOKEN: ${{ secrets.SCRAPER_TOKEN }}
          LASTFM_API_KEY: ${{ secrets.LASTFM_API_KEY }}
          DISCOGS_CONSUMER_KEY: ${{ secrets.DISCOGS_CONSUMER_KEY }}
          DISCOGS_CONSUMER_SECRET: ${{ secrets.DISCOGS_CONSUMER_SECRET }}
          PYTHONUNBUFFERED: 1   # the log keeps the commands' lines in order
        # The output also goes to a log for the failure email; pipefail keeps each command's exit status.
        run: |
          set -o pipefail
          { alembic upgrade head && python -m app.cli ingest; } 2>&1 | tee "$RUNNER_TEMP/ingest.log"

      - name: Commit the data
        working-directory: data
        # Appends to the ingest's log, so a failed commit or push is what the failure email shows.
        run: |
          set -o pipefail
          {
            # Fold the write-ahead log into the database so the committed file is complete.
            python -c "
          import sqlite3
          db = sqlite3.connect('the_list.db')
          db.execute('PRAGMA wal_checkpoint(TRUNCATE)')
          db.execute('PRAGMA journal_mode=DELETE')
          run = db.execute('SELECT id, status, edition_title FROM ingestion_runs ORDER BY id DESC LIMIT 1').fetchone()
          db.close()
          open('$RUNNER_TEMP/message', 'w').write(f'Ingest run {run[0]} ({run[1]}): {run[2] or \"no edition\"}')
          "
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add the_list.db faiss
            # Band photos kept with the data; -A also stages photos the ingest replaced and deleted.
            if [ -d images ]; then git add -A images; fi
            git diff --cached --quiet || { git commit -q -F "$RUNNER_TEMP/message" && git push -q; }
            git log -1 --format='%h %s'
          } 2>&1 | tee -a "$RUNNER_TEMP/ingest.log"

      - name: Email the maintainer what the ingest added
        # Only once the data is committed, from the committed database, so the email never reports data that
        # wasn't saved. A failed send leaves the run as it is.
        continue-on-error: true
        working-directory: backend
        env:
          DATABASE_URL: sqlite:///${{ github.workspace }}/data/the_list.db
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          ALERTS_FROM: ${{ vars.ALERTS_FROM || 'The List <alerts@list.sturgis.me>' }}
          MAINTAINER_EMAIL: ${{ secrets.MAINTAINER_EMAIL }}
          SITE_URL: https://list.sturgis.me
        run: python -m app.cli notify-success

      - name: Keep the data branch short
        working-directory: data
        run: |
          # The current data plus 3 commits to roll back to; older databases are squashed out.
          before=$(git rev-parse HEAD)
          after=$("$GITHUB_WORKSPACE/.github/scripts/prune-history.sh" 4)
          if [ "$after" != "$before" ]; then
            git push -q --force-with-lease="data:$before" origin HEAD:data
          fi
          git log --format='%h %s'

      - name: Email the maintainer if the ingest has been failing for two weeks
        # After any failed step of this job. This job's copy of the database has the failed ingestion run (with its
        # traceback) though the data branch doesn't. Sends at most one email a day, and only once the last
        # successful ingest is 14 days old (app/notifications.py). The job stays failed either way.
        if: failure()
        continue-on-error: true
        working-directory: backend
        env:
          DATABASE_URL: sqlite:///${{ github.workspace }}/data/the_list.db
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          ALERTS_FROM: ${{ vars.ALERTS_FROM || 'The List <alerts@list.sturgis.me>' }}
          MAINTAINER_EMAIL: ${{ secrets.MAINTAINER_EMAIL }}
          SITE_URL: https://list.sturgis.me
          LASTFM_API_KEY: ${{ secrets.LASTFM_API_KEY }}             # only to take them out of the email
          GOOGLE_MAPS_API_KEY: ${{ secrets.GOOGLE_MAPS_API_KEY }}
          DISCOGS_CONSUMER_KEY: ${{ secrets.DISCOGS_CONSUMER_KEY }}
          DISCOGS_CONSUMER_SECRET: ${{ secrets.DISCOGS_CONSUMER_SECRET }}
        run: python -m app.cli notify-failure --stage ingest --log "$RUNNER_TEMP/ingest.log"

  build:
    needs: ingest
    # Runs after a successful ingest, or without one on a push or a manual run that skips it; never after a
    # failed one, and not on an hourly run that found the List unchanged.
    if: ${{ !failure() && !cancelled() && (github.event_name != 'schedule' || needs.ingest.result == 'success') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      site_url: ${{ steps.pages.outputs.base_url }}

    steps:
      - uses: actions/checkout@v4

      - name: Check out the data branch
        uses: actions/checkout@v4
        with:
          ref: data
          path: data

      - name: Set up Python 3.12
        id: setup-python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Restore Python virtual environment
        id: cache-venv
        uses: actions/cache@v4
        with:
          path: .venv
          key: venv-${{ runner.os }}-py${{ steps.setup-python.outputs.python-version }}-${{ hashFiles('backend/requirements.txt') }}

      - name: Install backend dependencies
        run: |
          if [ "${{ steps.cache-venv.outputs.cache-hit }}" != "true" ]; then
            python -m venv .venv
            .venv/bin/pip install --upgrade pip
            .venv/bin/pip install -r backend/requirements.txt
          fi
          echo "$GITHUB_WORKSPACE/.venv/bin" >> "$GITHUB_PATH"

      - name: Export the data
        working-directory: backend
        env:
          DATABASE_URL: sqlite:///${{ github.workspace }}/data/the_list.db
          FAISS_INDEX_PATH: ${{ github.workspace }}/data/faiss
        # A deploy-only run (no ingest) can follow a migration; migrate this copy of the data so the
        # export's queries match the code. The data branch is migrated for good at the next ingest.
        run: |
          alembic upgrade head
          python -m app.cli export --out ../frontend/export

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - id: pages
        uses: actions/configure-pages@v5

      - name: Copy the Band photos into the site
        run: |
          rm -rf frontend/public/images
          if [ -d data/images ]; then cp -R data/images frontend/public/images; fi

      - name: Build the site
        working-directory: frontend
        env:
          # Where Pages serves the site: "" and the custom domain's URL when one is set (Settings -> Pages).
          PAGES_BASE_PATH: ${{ steps.pages.outputs.base_path }}
          PAGES_SITE_URL: ${{ steps.pages.outputs.base_url }}
          # Sign-in and Saved Filters (ADR 0003). Public by design; without them the Alerts features are hidden.
          # The repository variables keep their original NEXT_PUBLIC_ names; Astro reads PUBLIC_ ones.
          PUBLIC_SUPABASE_URL: ${{ vars.NEXT_PUBLIC_SUPABASE_URL }}
          PUBLIC_SUPABASE_ANON_KEY: ${{ vars.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          ASTRO_TELEMETRY_DISABLED: 1
        run: |
          npm ci
          npm run build

      - uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/dist

  deploy:
    needs: build
    # !cancelled(): without a status function GitHub adds success(), which is false whenever any earlier job in the
    # chain was skipped (check and ingest on a push or a skip_ingest run), even though build succeeded.
    if: ${{ !cancelled() && needs.build.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  alerts:
    # Email this week's Alerts (python -m app.cli alerts, ADR 0003): only after this run ingested a new edition
    # (never for a correction to the current one, or on a deploy-only run), and only once the site is live, so
    # the emails' links work. A failure here leaves the deployed site as it is; the run shows red and GitHub
    # emails the maintainer.
    needs: [check, ingest, build, deploy]
    if: ${{ !cancelled() && needs.check.outputs.new_edition == 'true' && needs.ingest.result == 'success' && needs.deploy.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - name: Check out the data branch
        uses: actions/checkout@v4
        with:
          ref: data   # the database the ingest just committed
          path: data

      - name: Set up Python 3.12
        id: setup-python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Restore Python virtual environment
        id: cache-venv
        uses: actions/cache@v4
        with:
          path: .venv
          key: venv-${{ runner.os }}-py${{ steps.setup-python.outputs.python-version }}-${{ hashFiles('backend/requirements.txt') }}

      - name: Install backend dependencies
        run: |
          if [ "${{ steps.cache-venv.outputs.cache-hit }}" != "true" ]; then
            python -m venv .venv
            .venv/bin/pip install --upgrade pip
            .venv/bin/pip install -r backend/requirements.txt
          fi
          echo "$GITHUB_WORKSPACE/.venv/bin" >> "$GITHUB_PATH"

      - name: Send Alerts
        working-directory: backend
        env:
          DATABASE_URL: sqlite:///${{ github.workspace }}/data/the_list.db
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          ALERTS_FROM: ${{ vars.ALERTS_FROM || 'The List <alerts@list.sturgis.me>' }}
          SITE_URL: ${{ needs.build.outputs.site_url || 'https://list.sturgis.me' }}
        # Logs counts only, never addresses; exits 1 if Supabase can't be read or any send fails.
        run: python -m app.cli alerts
