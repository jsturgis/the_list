name: Deploy

# Weekly: ingest the newest edition into the data branch's database, then export it to JSON, build the
# static site and publish it to GitHub Pages, then email everyone's weekly Alerts. Pushes to main and
# manual runs can skip the ingest; Alerts go out only after an ingest.
on:
  schedule:
    # Saturday 04:00 UTC = Friday 9pm PDT / 8pm PST, after the Drive publisher's 6-7pm Pacific update.
    - cron: '0 4 * * 6'
  workflow_dispatch:
    inputs:
      skip_ingest:
        description: Skip ingestion (rebuild from the existing data)
        type: boolean
        default: false
  push:
    branches: [main]
    paths:
      - 'frontend/**'
      - 'backend/app/**'   # the export lives in the backend
      - '.github/workflows/deploy.yml'

permissions:
  contents: read

# One run at a time; a newer run waits rather than cancelling one mid-ingest or mid-publish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  ingest:
    if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && !inputs.skip_ingest)
    runs-on: ubuntu-latest
    permissions:
      contents: write   # commit the new database to the data branch

    services:
      ollama:
        image: ollama/ollama
        ports:
          - 11434:11434
        volumes:
          - /home/runner/.ollama:/root/.ollama   # models, cached between runs

    steps:
      - uses: actions/checkout@v4

      - name: Check out the data branch
        uses: actions/checkout@v4
        with:
          ref: data
          path: data
          fetch-depth: 5   # enough to tell whether there's history to prune

      - name: Restore the Ollama model cache
        uses: actions/cache@v4
        with:
          path: /home/runner/.ollama
          key: ollama-nomic-embed-text-v1

      - name: Pull the embedding model
        run: |
          until curl -sf http://localhost:11434/api/version > /dev/null; do sleep 2; done
          curl -sf http://localhost:11434/api/pull -d '{"model": "nomic-embed-text", "stream": false}'
          # The container writes as root; let the cache step read the files.
          sudo chown -R "$USER" /home/runner/.ollama

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: backend/requirements.txt

      - name: Install backend dependencies
        run: pip install -r backend/requirements.txt

      - name: Ingest
        working-directory: backend
        env:
          DATABASE_URL: sqlite:///${{ github.workspace }}/data/the_list.db
          FAISS_INDEX_PATH: ${{ github.workspace }}/data/faiss
          IMAGES_PATH: ${{ github.workspace }}/data/images
          OLLAMA_BASE_URL: http://localhost:11434
          DRIVE_LATEST_FILE_ID: ${{ vars.DRIVE_LATEST_FILE_ID }}
          GOOGLE_MAPS_API_KEY: ${{ secrets.GOOGLE_MAPS_API_KEY }}
          LASTFM_API_KEY: ${{ secrets.LASTFM_API_KEY }}
        run: |
          alembic upgrade head
          python -m app.cli ingest

      - name: Commit the data
        working-directory: data
        run: |
          # Fold the write-ahead log into the database so the committed file is complete.
          python -c "
          import sqlite3
          db = sqlite3.connect('the_list.db')
          db.execute('PRAGMA wal_checkpoint(TRUNCATE)')
          db.execute('PRAGMA journal_mode=DELETE')
          run = db.execute('SELECT id, status, email_subject FROM ingestion_runs ORDER BY id DESC LIMIT 1').fetchone()
          db.close()
          open('$RUNNER_TEMP/message', 'w').write(f'Ingest run {run[0]} ({run[1]}): {run[2] or \"no new edition\"}')
          "
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add the_list.db faiss
          # Band photos kept with the data; -A also stages photos the ingest replaced and deleted.
          if [ -d images ]; then git add -A images; fi
          git diff --cached --quiet || { git commit -q -F "$RUNNER_TEMP/message" && git push -q; }
          git log -1 --format='%h %s'

      - name: Keep the data branch short
        working-directory: data
        run: |
          # The current data plus 3 commits to roll back to; older databases are squashed out.
          before=$(git rev-parse HEAD)
          after=$("$GITHUB_WORKSPACE/.github/scripts/prune-history.sh" 4)
          if [ "$after" != "$before" ]; then
            git push -q --force-with-lease="data:$before" origin HEAD:data
          fi
          git log --format='%h %s'

  build:
    needs: ingest
    # Runs after a successful ingest, or when the ingest was skipped; never after a failed one.
    if: ${{ !failure() && !cancelled() }}
    runs-on: ubuntu-latest
    outputs:
      site_url: ${{ steps.pages.outputs.base_url }}

    steps:
      - uses: actions/checkout@v4

      - name: Check out the data branch
        uses: actions/checkout@v4
        with:
          ref: data
          path: data

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: backend/requirements.txt

      - name: Install backend dependencies
        run: pip install -r backend/requirements.txt

      - name: Export the data
        working-directory: backend
        env:
          DATABASE_URL: sqlite:///${{ github.workspace }}/data/the_list.db
          FAISS_INDEX_PATH: ${{ github.workspace }}/data/faiss
        # A deploy-only run (no ingest) can follow a migration; migrate this copy of the data so the
        # export's queries match the code. The data branch is migrated for good at the next ingest.
        run: |
          alembic upgrade head
          python -m app.cli export --out ../frontend/export

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - id: pages
        uses: actions/configure-pages@v5

      - name: Copy the Band photos into the site
        run: |
          rm -rf frontend/public/images
          if [ -d data/images ]; then cp -R data/images frontend/public/images; fi

      - name: Build the site
        working-directory: frontend
        env:
          # Where Pages serves the site: "" and the custom domain's URL when one is set (Settings -> Pages).
          PAGES_BASE_PATH: ${{ steps.pages.outputs.base_path }}
          PAGES_SITE_URL: ${{ steps.pages.outputs.base_url }}
          # Sign-in and Saved Filters (ADR 0003). Public by design; without them the Alerts features are hidden.
          # The repository variables keep their original NEXT_PUBLIC_ names; Astro reads PUBLIC_ ones.
          PUBLIC_SUPABASE_URL: ${{ vars.NEXT_PUBLIC_SUPABASE_URL }}
          PUBLIC_SUPABASE_ANON_KEY: ${{ vars.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          ASTRO_TELEMETRY_DISABLED: 1
        run: |
          npm ci
          npm run build

      - uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/dist

  deploy:
    needs: build
    if: ${{ !failure() && !cancelled() }}
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  alerts:
    # Email this week's Alerts (python -m app.cli alerts, ADR 0003): only after this run ingested an edition
    # (never on a deploy-only run), and only once the site is live, so the emails' links work. A failure here
    # leaves the deployed site as it is; the run shows red and GitHub emails the maintainer.
    needs: [ingest, build, deploy]
    if: ${{ needs.ingest.result == 'success' && needs.deploy.result == 'success' }}
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Check out the data branch
        uses: actions/checkout@v4
        with:
          ref: data   # the database the ingest just committed
          path: data

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: backend/requirements.txt

      - name: Install backend dependencies
        run: pip install -r backend/requirements.txt

      - name: Send Alerts
        working-directory: backend
        env:
          DATABASE_URL: sqlite:///${{ github.workspace }}/data/the_list.db
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          ALERTS_FROM: ${{ vars.ALERTS_FROM || 'The List <alerts@list.sturgis.me>' }}
          SITE_URL: ${{ needs.build.outputs.site_url || 'https://list.sturgis.me' }}
        # Logs counts only, never addresses; exits 1 if Supabase can't be read or any send fails.
        run: python -m app.cli alerts
