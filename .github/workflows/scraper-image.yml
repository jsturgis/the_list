name: Scraper image

# The page fetcher the home server runs for the Ingest jobs workflow (scraper/, ADR 0007): test it, then build its
# image and publish it as ghcr.io/jsturgis/the-list-scraper, which the Dockge stack on the server pulls.
on:
  push:
    branches: [main]
    paths:
      - 'scraper/**'
      - '.github/workflows/scraper-image.yml'
  pull_request:
    branches: [main]
    paths:
      - 'scraper/**'
      - '.github/workflows/scraper-image.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run the tests
        working-directory: scraper
        run: |
          pip install -r requirements.txt pytest
          python -m pytest -q

  publish:
    needs: test
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: scraper
          push: true
          platforms: linux/amd64
          labels: org.opencontainers.image.source=https://github.com/${{ github.repository }}
          tags: |
            ghcr.io/jsturgis/the-list-scraper:latest
            ghcr.io/jsturgis/the-list-scraper:${{ github.sha }}
