name: Backfill

# Manual: look existing Bands up on the services (MusicBrainz, Last.fm, Discogs, Wikimedia Commons) the way new ones
# are at ingest (python -m app.cli backfill), commit the data branch and republish the site. Resumable: each run
# takes the Bands not yet looked up, those on Upcoming Shows first, and stops at the time budget; run it again
# until it reports none still to do.
on:
  workflow_dispatch:
    inputs:
      max_minutes:
        description: Stop looking Bands up after this many minutes (keep under ~320; a job may run 6 hours)
        type: number
        default: 300
      limit:
        description: Look up at most this many Bands (blank for no limit)
        type: string
        default: ''

permissions:
  contents: read

# Shares the Deploy workflow's group: never runs alongside an ingest (both commit to data), and a Deploy waits
# for it. A Backfill still waiting to start is replaced by a newer Deploy; run it again after.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    permissions:
      contents: write   # commit the data branch
      actions: write    # start the Deploy workflow

    services:
      ollama:
        image: ollama/ollama
        ports:
          - 11434:11434
        volumes:
          - /home/runner/.ollama:/root/.ollama

    steps:
      - uses: actions/checkout@v4

      - name: Check out the data branch
        uses: actions/checkout@v4
        with:
          ref: data
          path: data
          fetch-depth: 5

      - name: Restore the Ollama model cache
        uses: actions/cache@v4
        with:
          path: /home/runner/.ollama
          key: ollama-nomic-embed-text-v1

      - name: Pull the embedding model
        run: |
          until curl -sf http://localhost:11434/api/version > /dev/null; do sleep 2; done
          curl -sf http://localhost:11434/api/pull -d '{"model": "nomic-embed-text", "stream": false}'
          sudo chown -R "$USER" /home/runner/.ollama

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: backend/requirements.txt

      - name: Install backend dependencies
        run: pip install -r backend/requirements.txt

      - name: Backfill
        # A step timeout (unlike the job's) fails just this step, so the Bands looked up so far are still committed.
        timeout-minutes: 330
        working-directory: backend
        env:
          DATABASE_URL: sqlite:///${{ github.workspace }}/data/the_list.db
          FAISS_INDEX_PATH: ${{ github.workspace }}/data/faiss
          IMAGES_PATH: ${{ github.workspace }}/data/images
          OLLAMA_BASE_URL: http://localhost:11434
          LASTFM_API_KEY: ${{ secrets.LASTFM_API_KEY }}
          DISCOGS_CONSUMER_KEY: ${{ secrets.DISCOGS_CONSUMER_KEY }}
          DISCOGS_CONSUMER_SECRET: ${{ secrets.DISCOGS_CONSUMER_SECRET }}
          MAX_MINUTES: ${{ inputs.max_minutes }}
          LIMIT: ${{ inputs.limit }}
        run: |
          alembic upgrade head
          python -m app.cli backfill --max-minutes "$MAX_MINUTES" ${LIMIT:+--limit "$LIMIT"} | tee "$RUNNER_TEMP/message"

      - name: Commit the data
        # Even after a failed backfill step: each Band was committed to the database as it was looked up.
        if: ${{ !cancelled() }}
        working-directory: data
        run: |
          [ -s "$RUNNER_TEMP/message" ] || echo "backfill: stopped early" > "$RUNNER_TEMP/message"
          python -c "
          import sqlite3
          db = sqlite3.connect('the_list.db')
          db.execute('PRAGMA wal_checkpoint(TRUNCATE)')
          db.execute('PRAGMA journal_mode=DELETE')
          db.close()
          "
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add the_list.db faiss
          if [ -d images ]; then git add -A images; fi
          git diff --cached --quiet || { git commit -q -F "$RUNNER_TEMP/message" && git push -q; }
          git log -1 --format='%h %s'

      - name: Keep the data branch short
        if: ${{ !cancelled() }}
        working-directory: data
        run: |
          before=$(git rev-parse HEAD)
          after=$("$GITHUB_WORKSPACE/.github/scripts/prune-history.sh" 4)
          if [ "$after" != "$before" ]; then
            git push -q --force-with-lease="data:$before" origin HEAD:data
          fi
          git log --format='%h %s'

      - name: Republish the site
        env:
          GH_TOKEN: ${{ github.token }}
        # Queues behind this run (same concurrency group), so it builds from the data just committed. GitHub keeps
        # one pending run per group and cancels the older, so if a Deploy (the weekly ingest, say) is already
        # waiting, leave it: it publishes this data too, and queueing ours would cancel it.
        run: |
          waiting=$(gh run list --workflow deploy.yml --json status --jq '[.[] | select(.status == "pending" or .status == "queued" or .status == "waiting")] | length')
          if [ "$waiting" -gt 0 ]; then
            echo "A Deploy is already waiting; it will publish this data."
          else
            gh workflow run deploy.yml --ref main -f skip_ingest=true
          fi
