services:
  api:
    build: ./backend
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data          # SQLite DB + FAISS indices (persisted on host)
      - ./samples:/samples:ro     # sample emails — available for seed script
    env_file:
      - ./backend/.env
    environment:
      # Override path-sensitive defaults so data lands in the mounted volume
      DATABASE_URL: sqlite:////app/data/the_list.db
      FAISS_INDEX_PATH: /app/data/faiss

  # Optional: local Ollama for embeddings.
  # Remove this service if you're pointing at an external Ollama instance.
  ollama:
    image: ollama/ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_models:/root/.ollama

volumes:
  ollama_models:
